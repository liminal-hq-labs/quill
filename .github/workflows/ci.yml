# One job per check, so a pull request's checks list names exactly what passed or failed.
# Language-neutral checks run as they are; uncomment the Rust block below (or add the
# equivalent for the project's language) once there is code to check.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Jobs run in the shared Liminal HQ images (liminal-hq/.github, docker/ci/Dockerfile), pinned by digest; a pin update is a pull request and
# its checks run in the new image. `ci-rust` is the leanest tier (Rust 1.98.0, rustfmt, clippy, nextest, git). `ci-dos` is `ci-rust` plus
# python3, mtools, DJGPP, DOSBox Staging and CWSDPMI under $DOS_TOOLCHAIN (/opt/dos-toolchain), so no job downloads the DOS tools. `ci-art` carries the SVG and render tools
# (librsvg, ImageMagick 6, shellcheck, numpy, Pillow). Two jobs stay on the host runner (markdown: a Docker action; site: stdlib python3
# only); banner stays too, because its text-fit pass drives the runner's Chrome. See CI-1 in docs/decisions.md.
jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

  headers:
    name: Licence headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check SPDX headers
        run: bash scripts/check-headers.sh

  site:
    name: Site links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check links and assets in site/
        run: python3 -I scripts/check-site.py

  ids:
    name: Decision ids
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test the id checker
        run: python3 -I scripts/test_check_ids.py

      - name: Check the decision-id registry
        run: python3 -I scripts/check-ids.py

  unicode-docs:
    name: Unicode test documents
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the generated documents are what the script writes
        run: python3 -I scripts/gen-unicode-docs.py --check

      - name: Check the frozen .QLD 1.0 reader is unchanged
        run: bash scripts/check-frozen-reader.sh

  size-gate:
    name: Size gate tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The budgets file and the gate's readers; the disks themselves are checked by the next job.
      - name: Test the size gate and check the budgets file
        run: python3 -I installer/tools/test_size_gate.py

  disk-sizes:
    name: Disk sizes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The shared ci-dos image (Rust 1.98.0, python3, mtools, objdump and CWSDPMI under $DOS_TOOLCHAIN): the job builds the three
    # programs, the dictionaries and the three disks, then checks every packed size and free byte against installer/budgets.toml
    # (INS-22). Liminal Installer's `liminst` and its three runtimes are built at the pinned commit (installer/liminst.rev).
    container:
      image: ghcr.io/liminal-hq/ci-dos@sha256:08ef2d984d71ed635d38e1ba8e164c0d8d1be6b34265c3b466ccf4894d934930
    env:
      QUILL_BUILD_DIR: /tmp/quill-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # QUILL32.EXE links with lld-link, which the image does not carry (the ReactOS demo job installs it the same way).
      - name: Install the Windows linker
        run: apt-get update && apt-get install -y --no-install-recommends lld llvm

      - name: Build the programs and the dictionaries
        run: bash installer/tools/stage.sh --build

      - name: Build the disks
        run: bash installer/tools/build-disks.sh

      # Checks the packs, then size-gate.py: QUILLDOS.EXE's budget, QUILL.EXE's data segment, each module's budget and each disk's
      # free bytes, with every file's packed size in the job summary.
      - name: Check the disks and the size budgets
        run: bash installer/tools/verify-disks.sh

      - name: Upload the size table
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: disk-sizes
          path: installer/out/SIZES.txt
          if-no-files-found: ignore
          retention-days: 14

  pointer:
    name: Pointer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test the pointer module and its direction-error measure
        run: node --test scripts/pointer/*.test.mjs

  try-cache:
    name: Try Quill cache busting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/liminal-hq/ci-dos@sha256:08ef2d984d71ed635d38e1ba8e164c0d8d1be6b34265c3b466ccf4894d934930
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Builds the disk bundle three times from stand-in programs (FreeDOS and CuteMouse come from their pinned addresses) and checks that
      # the name follows the content, the manifest names the one bundle left, and the page's own versions are current.
      - name: Check the bundle name, the manifest and the page's versions
        run: bash scripts/check-try.sh

  reactos-guest:
    name: ReactOS demo scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # librsvg, ImageMagick 6, shellcheck, numpy and Pillow come with the image, so no apt step runs.
    container:
      image: ghcr.io/liminal-hq/ci-art@sha256:fffbd2c6a87556c4a19626f95732ef54cfbb8d8fea8c532d30ebb497cfe25800
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The Afterglow pin, the fetch script (on a local tarball, no network) and the Quillify overlay (a synthetic wallpaper).
      - name: Test the Afterglow pin, fetch and Quillify
        run: python3 -I -m unittest discover -s site/try-reactos/guest -p 'test_afterglow.py'

      # The disk parts' size: make-parts.mjs, and the page, the build and the README agreeing on it.
      - name: Test the disk parts
        run: python3 -I -m unittest discover -s site/try-reactos/guest -p 'test_parts.py'

      # The clean address: staging names follow content, and the page's ?v= stamps are current.
      - name: Test the web staging and stamps
        run: python3 -I -m unittest discover -s site/try-reactos/guest -p 'test_stage_web.py'

      - name: Check the guest scripts
        run: shellcheck -S warning site/try-reactos/guest/fetch-afterglow.sh site/try-reactos/guest/prepare-afterglow.sh site/try-reactos/guest/prepare-pointers.sh

  host-link:
    name: Host link tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The vectors are written from the specification by a script; the files on disk must be what it writes. The Rust codec reads the same
      # files in the workspace's test job.
      - name: Check the shared vectors are current
        run: python3 -I tests/host-link/gen_vectors.py --check

      - name: Install the package's tools
        working-directory: site/try-reactos/packages/host-link
        run: bun install --frozen-lockfile

      - name: Test the package
        working-directory: site/try-reactos/packages/host-link
        run: bun test

      - name: Check the types
        working-directory: site/try-reactos/packages/host-link
        run: bun run typecheck

      # site/try-reactos/lib/host-link.js is what the page loads: it must be what the package builds, within its 40 KB budget.
      - name: Check the built module is current
        working-directory: site/try-reactos/packages/host-link
        run: bun run check:built

  ac97:
    name: AC'97 sound card tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install the package's tools
        working-directory: site/try-reactos/packages/ac97
        run: bun install --frozen-lockfile

      # The chip model, the v86 glue on a fake machine and the output on a fake audio context; the pinned v86 version is checked against tools/fetch-v86.sh.
      - name: Test the package
        working-directory: site/try-reactos/packages/ac97
        run: bun test

      - name: Check the types
        working-directory: site/try-reactos/packages/ac97
        run: bun run typecheck

      # site/try-reactos/lib/ac97.js is what the page loads: it must be what the package builds, within its 36 KB budget.
      - name: Check the built module is current
        working-directory: site/try-reactos/packages/ac97
        run: bun run check:built

  dos-bridge:
    name: DOS bridge tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The tests check every volume the package builds with fsck.fat and mtools, and make the real C: and D: images with
      # scripts/make-bridge-disks.py; the reactos workflows install mtools the same way.
      - name: Install the disk tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mtools dosfstools

      - name: Install the package's tools
        working-directory: site/try/packages/dos-bridge
        run: bun install --frozen-lockfile

      # fat.ts against the images tests/dos-bridge/make-goldens.py made with mtools, names.ts against a table, the bridge on a fake player.
      - name: Test the package
        working-directory: site/try/packages/dos-bridge
        run: bun test

      - name: Check the types
        working-directory: site/try/packages/dos-bridge
        run: bun run typecheck

      # site/try/lib/dos-bridge.js is what the page loads: it must be what the package builds, within its 16 KB budget.
      - name: Check the built module is current
        working-directory: site/try/packages/dos-bridge
        run: bun run check:built

  layers:
    name: Layers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # python3 and cargo together: only the DOS tier has both. The script reads `cargo metadata --no-deps`.
    container:
      image: ghcr.io/liminal-hq/ci-dos@sha256:08ef2d984d71ed635d38e1ba8e164c0d8d1be6b34265c3b466ccf4894d934930
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the layer rules
        run: python3 -I scripts/check-layers.py

  banner:
    name: Hero banner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The runner image's Microsoft apt source (packages-microsoft-prod) sometimes serves an unsigned InRelease, which fails
      # `apt-get update` with a 403. Nothing here installs from it, so drop it first.
      - name: Drop the Microsoft apt source
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list

      - name: Install SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils librsvg2-bin fonts-dejavu-core fonts-liberation

      # The runner image ships Google Chrome, which the text-fit pass drives headless.
      - name: Check the banner
        env:
          BANNER_REQUIRE_RENDER: '1'
        run: bash scripts/check-banner.sh

  # Rust: one job per check in the shared ci-rust image.
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quill

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  wasm:
    name: WebAssembly build of quill-paint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quill

      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Check the pixel surface builds for the browser
        run: cargo check --target wasm32-unknown-unknown -p quill-paint --features pixel --locked

  bare:
    name: Bare-metal build of quill-job
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quill

      - name: Add the bare-metal target
        run: rustup target add x86_64-unknown-none

      - name: Check the job crate builds with no operating system
        run: cargo build --release --target x86_64-unknown-none -p quill-job --locked

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quill

      - name: Run the tests
        run: cargo nextest run --workspace --locked --profile ci

      # `publish-test-results.yml` reads these after the run, with the permissions a fork's pull request lacks.
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rust-test-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

      - name: Upload the event file
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: event-file
          path: ${{ github.event_path }}
