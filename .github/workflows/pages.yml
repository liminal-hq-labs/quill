# Publishes the product page in site/ to GitHub Pages when a change to it reaches main, or when run by hand. The site is
# static, so the build job checks its links (the outside ones too) and uploads the folder; the deploy job publishes it.
# The site is served at http://labs.liminalhq.ca/quill/ (the organization's custom domain).
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

# Two files are built here rather than committed: the Try Quill page's disk bundle, site/try/quill.<hash>.jsdos, which holds FreeDOS
# and QUILLDOS.EXE, and the manifest that names it, site/try/try-manifest.json (the page's cache busting, SITE-4). No release builds
# exist to fetch the bundle from, so the job builds the DOS program from source (the pinned Rust toolchain and CWSDPMI's stub; no
# DOSBox, no Docker) and packs the disk with scripts/build-try.sh. That is a few minutes more than the static upload alone, and it
# keeps the demo on the code in main.
#
name: Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      # What the Try Quill disk is built from.
      - 'scripts/build-try.sh'
      - 'scripts/stamp-try.py'
      - 'scripts/make-freedos-image.py'
      - 'scripts/try-disk/**'
      - 'scripts/try-dosbox.conf'
      - 'dos/**'
      - 'crates/**'
      - 'dict/**'
      - 'tests/docs/**'
      - 'assets/fonts/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one that is publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Upload the site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Install mtools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mtools

      # Builds QUILLDOS.EXE, the graphics-mode fonts and the dictionary, fetches FreeDOS 1.3 (checked against a pinned SHA-256 sum)
      # and writes the hashed bundle and the manifest. The folder is built from scratch, so it holds only what the manifest names.
      - name: Build the Try Quill disk
        run: bash scripts/build-try.sh --build

      # The pull-request check (ci.yml) covers local links; here the outside links are fetched too before publishing.
      - name: Check links, including outside ones
        run: python3 -I scripts/check-site.py --external

      - name: Upload the site folder
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
