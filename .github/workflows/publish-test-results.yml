# Posts the results of a finished CI run to its pull request: one comment and a check run per suite.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

name: Publish Test Results

# A separate workflow because the `pull_request` token is read-only for forks, and the publisher needs
# `checks: write`. A `workflow_run` trigger runs with this file's own permissions, from the default branch,
# whoever opened the pull request. It reads the `rust-test-results` artefact (the `Tests` job in `ci.yml`)
# and `event-file`. It never checks out or runs the pull request's code.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  publish:
    if: github.event.workflow_run.conclusion != 'skipped' && github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      actions: read # list and download the run's artefacts
      checks: write # create and update check runs and annotations
      pull-requests: write # create and update the sticky comment
      contents: read # check out .github/ from the default branch
    uses: liminal-hq-labs/pr-results/.github/workflows/publish.yml@a70c20d946cfe13ed8199018feee88578a96ae51 # v0.4.1
