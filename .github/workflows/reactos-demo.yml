# Builds the ReactOS demo image (the guest disk as zstd parts and the v86 saved state for site/try-reactos/) from the official ReactOS
# 0.4.16 install CD, with no hand step: guest/build-all.sh does the work (see site/try-reactos/README.md). Run by hand only.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

# The artifact holds ReactOS (GPL-2.0-or-later and other free licences), WineVDM (GPL-2.0) and v86's BIOS (LGPL-3.0). It stays a private
# workflow artifact with a short retention. Publishing it anywhere means publishing the corresponding source too; the job summary lists it.
#
# The install takes a few minutes with KVM and hours without it, so the golden disk is cached by the hash of the files that shape it
# (the ISO's pinned address and hashes are in install-golden.sh). A hosted runner has about 14 GB free on / and far more on /mnt, so the
# work goes to /mnt.
name: ReactOS demo

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: reactos-demo
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CI_DIR: /mnt/reactos-demo/ci
  DL_DIR: /mnt/reactos-demo/dl
  WORK: /mnt/reactos-demo/ci/work
  DIST: /mnt/reactos-demo/dist

jobs:
  quill:
    name: Build the Quill programs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Build QUILL32.EXE and QUILL.EXE
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          bash win9x/build.sh
          bash win16/build.sh
          mkdir -p "$RUNNER_TEMP/quill"
          cp win9x/dist/QUILL32.EXE win16/out/QUILL.EXE "$RUNNER_TEMP/quill/"

      - name: Upload the programs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: quill-programs
          path: ${{ runner.temp }}/quill
          retention-days: 1
          if-no-files-found: error

  image:
    name: Build the demo image
    needs: quill
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download the Quill programs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: quill-programs
          path: ${{ runner.temp }}/quill

      - name: Make room and show the disks
        run: |
          sudo mkdir -p /mnt/reactos-demo
          sudo chown "$USER" /mnt/reactos-demo
          mkdir -p "$CI_DIR" "$DL_DIR" "$WORK" "$DIST"
          df -h / /mnt

      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 mtools xorriso zstd imagemagick librsvg2-bin curl unzip python3 python3-numpy llvm lld

      # Hosted runners expose /dev/kvm to root only; this is the usual udev rule that opens it to everyone. Without it (a runner with no
      # nested virtualization) the build falls back to QEMU's software emulation, which the 300-minute limit allows but is far slower.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -w /dev/kvm ]; then echo "KVM is available" >> "$GITHUB_STEP_SUMMARY"; else echo "No KVM: QEMU will use software emulation (slow)" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.21.1'

      # Headless Chromium for the state build, from Playwright's own download (the runner image has no unsnapped Chromium).
      - name: Install headless Chromium
        working-directory: site/try-reactos/harness
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.65.0
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM=$(node -p "require('playwright-core').chromium.executablePath()")" >> "$GITHUB_ENV"

      # The golden disk is stored zstd-compressed (a 4 GiB sparse file would otherwise be read in full). Its key covers every file that
      # shapes the install, and the pinned ISO address and hashes live in install-golden.sh.
      - name: Restore the golden disk
        id: golden
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.CI_DIR }}/golden-cache
          key: reactos-golden-${{ hashFiles('site/try-reactos/guest/unattend.inf', 'site/try-reactos/guest/install-golden.sh', 'site/try-reactos/guest/patch-iso.py') }}

      - name: Unpack the cached golden disk
        if: steps.golden.outputs.cache-hit == 'true'
        run: |
          zstd -d -q -T0 "$CI_DIR/golden-cache/reactos16-golden-scripted.img.zst" -o "$CI_DIR/reactos16-golden-scripted.img"
          cp "$CI_DIR/golden-cache/reactos16-golden-scripted.img.stamp" "$CI_DIR/"

      # The emulator the state build runs is not committed: the script downloads the pinned release and checks its SHA-256 sums.
      - name: Fetch v86
        run: bash site/try-reactos/tools/fetch-v86.sh

      # The Afterglow theme is not committed: build-all.sh fetches the commit named in guest/afterglow.pin (checked by SHA-256), builds the
      # ReactOS style from it with llvm-rc and lld-link (installed above) and puts the Quill emblem on its dusk wallpaper (guest/quillify.py).
      # The style's hash is checked against the pin, so a toolchain that builds different bytes fails here. AFTERGLOW=0 would skip it.
      # install-golden.sh is skipped inside when the unpacked disk's stamp matches.
      - name: Build the demo image
        env:
          QUILL_DIR: ${{ runner.temp }}/quill
          QUILL_COMMIT: ${{ github.sha }}
        run: bash site/try-reactos/guest/build-all.sh

      - name: Pack the golden disk for the cache
        if: steps.golden.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CI_DIR/golden-cache"
          zstd -19 -q -T0 -f "$CI_DIR/reactos16-golden-scripted.img" -o "$CI_DIR/golden-cache/reactos16-golden-scripted.img.zst"
          cp "$CI_DIR/reactos16-golden-scripted.img.stamp" "$CI_DIR/golden-cache/"
          du -h "$CI_DIR/golden-cache"/*

      - name: Summarise
        if: always()
        run: python3 -I site/try-reactos/tools/job-summary.py "$DIST/build-manifest.json" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Show the disks
        if: always()
        run: df -h / /mnt

      - name: Upload the image
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: reactos-demo-image
          path: ${{ env.DIST }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Keep the install screenshots when the build failed
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: reactos-install-diagnostics
          path: |
            ${{ env.CI_DIR }}/install/shots
            ${{ env.CI_DIR }}/install/serial-*.txt
          retention-days: 3
          if-no-files-found: ignore
