[workspace]
resolver = "2"
members = ["crates/quill-core", "crates/quill-dlg", "crates/quill-formats", "crates/quill-host", "crates/quill-grid", "crates/quill-app", "crates/quill-heap", "crates/quill-image", "crates/quill-inflate", "crates/quill-dict", "crates/quill-spell"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[profile.release]
opt-level = "z"
panic = "abort"
overflow-checks = true
lto = true

[profile.dev]
panic = "unwind"
