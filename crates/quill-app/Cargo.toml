[package]
name = "quill-app"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false
description = "Quill's editor controller: keys, commands, menus and the text-mode painter, shared by every build"

[dependencies]
quill-core = { path = "../quill-core" }
quill-formats = { path = "../quill-formats" }
quill-grid = { path = "../quill-grid" }
quill-image = { path = "../quill-image" }
quill-inflate = { path = "../quill-inflate" }
quill-spell = { path = "../quill-spell" }

[features]
# File names up to a Windows path (260 bytes) instead of a DOS one (64); the Win32 build turns it on.
long-names = []

[package.metadata.quill]
layer = "editor"
no_std = true
alloc = false
float = true
