[package]
name = "quill-app"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false
description = "Quill's editor controller: keys, commands, menus and the text-mode painter, shared by every build"

[dependencies]
quill-clip = { path = "../quill-clip", default-features = false }
quill-core = { path = "../quill-core" }
quill-dlg = { path = "../quill-dlg" }
quill-formats = { path = "../quill-formats" }
quill-grid = { path = "../quill-grid" }
quill-image = { path = "../quill-image" }
quill-job = { path = "../quill-job" }
quill-mouse = { path = "../quill-mouse" }
quill-spell = { path = "../quill-spell" }

[features]
# File names up to a Windows path (260 bytes) instead of a DOS one (64); the Win32 build turns it on.
long-names = []
# Recovery copies may be named as dot-files (`.~Quill-NAME.rcv`), as the Linux builds keep them; without it the code for those names is not linked.
dot-files = []

# The file dialog of the text screens (`Mode::File`, `filedialog`, `filepaint`): on for the DOS text screen, the host and the terminal
# client, off for the Windows builds, whose `QUILL.EXE` and `QUILL32.EXE` use the system's dialogs and must not link it.
text-file-dialog = []

# The recovery question in a box of the app's own cells (`Mode::Recover`), for the DOS screens and the host that plays them; the Windows
# builds ask it in a message box and must not link it.
text-recovery = []

[package.metadata.quill]
layer = "editor"
no_std = true
alloc = false
float = true
