[package]
name = "quill-chrome"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Quill's shared window geometry: toolbar buttons, ruler, page position, scroll bar layout and the zoom box, in pixels (no_std, no alloc, no floats)"

[dependencies]
quill-core = { path = "../quill-core" }
quill-app = { path = "../quill-app" }

[package.metadata.quill]
layer = "kit"
no_std = true
alloc = false
float = false
