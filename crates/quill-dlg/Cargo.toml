# quill-dlg: the logic of Quill's file dialogs: DOS 8.3 names, file types, Save As naming, widgets and the file dialog's state machine.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[package]
name = "quill-dlg"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false
description = "Quill's dialog logic: 8.3 names, file types, Save As naming, widgets and the file dialog, with no drawing and no platform"

[dependencies]
quill-core = { path = "../quill-core" }

[features]
# `fake`: an in-memory file system tree (`fake::FakeFs`) for the shells' host tests; it uses `std`, so it is off by default.
fake = []

[dev-dependencies]
quill-heap = { path = "../quill-heap" }
proptest = { version = "1", default-features = false, features = ["std"] }
