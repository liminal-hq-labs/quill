[package]
name = "quill-fntgen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Host tool: renders outline faces into the hinted bitmap strikes of QUILL.FNT for the DOS graphics mode"

[[bin]]
name = "quill-fntgen"
path = "src/main.rs"

[dependencies]
quill-core = { path = "../quill-core" }
quill-formats = { path = "../quill-formats" }
quill-host = { path = "../quill-host" }
skrifa = "0.50"
tiny-skia = "0.12"
miniz_oxide = "0.8"
sha2 = "0.10"
