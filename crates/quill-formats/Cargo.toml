[package]
name = "quill-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Quill's file formats: .QLD, RTF and plain text over byte-stream traits"

[dependencies]
quill-core = { path = "../quill-core" }

[dev-dependencies]
quill-host = { path = "../quill-host" }
proptest = { version = "1", default-features = false, features = ["std"] }

[package.metadata.quill]
layer = "editor"
no_std = true
alloc = false
float = false
