[package]
name = "quill-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Quill's host tools: HostStore, the measures, quill-render and the golden tests"

[[bin]]
name = "quill-render"
path = "src/bin/quill-render.rs"

[dependencies]
quill-heap = { path = "../quill-heap" }
quill-grid = { path = "../quill-grid" }
quill-app = { path = "../quill-app" }
quill-core = { path = "../quill-core" }
quill-formats = { path = "../quill-formats" }
quill-dict = { path = "../quill-dict" }

[features]
# Test the editor as the Win32 build is built: file names keep the case the file system returns.
long-names = ["quill-app/long-names"]

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
quill-mouse = { path = "../quill-mouse", features = ["fake"] }

[package.metadata.quill]
layer = "tool"
no_std = false
alloc = true
float = true
