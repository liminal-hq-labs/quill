[package]
name = "quill-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A no_std PDF 1.4 writer: standard 14 text fonts positioned from a layout, images, and its own deflate encoder"

[dev-dependencies]
quill-inflate = { path = "../quill-inflate" }

[package.metadata.quill]
layer = "base"
no_std = true
alloc = true
float = false
