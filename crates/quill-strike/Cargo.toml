[package]
name = "quill-strike"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Quill's bitmap fonts for the DOS graphics mode: the QUILL.FNT reader, a Measure over strikes and the strike choice"

[dependencies]
quill-core = { path = "../quill-core" }

[features]
# Host only: an in-memory QUILL.FNT writer and the deterministic test font, for tests and goldens.
builder = []

[dev-dependencies]
quill-strike = { path = ".", features = ["builder"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[package.metadata.quill]
layer = "kit"
no_std = true
alloc = false
float = false
