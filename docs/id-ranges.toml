# Reserve a block with `scripts/next-id.sh PREFIX COUNT OWNER` before writing a plan; do not edit blocks by hand
# except to change a status (reserved, in use, retired) or to correct an owner or source. `python3 scripts/check-ids.py`
# checks this file against docs/decisions.md, and `--write` regenerates docs/id-ranges.md from it. Legacy `D` numbers are
# frozen history and are not recorded here.

# Ids that `docs/decisions.md` uses twice today. Neither row is renumbered (the SPEC and the code cite both); the checker
# accepts exactly these and fails if one stops being a duplicate.
