[package]
name = "quill-dos"
version = "0.0.0"
edition = "2021"
publish = false
description = "Quill for DOS"
license = "Apache-2.0 OR MIT"

[[bin]]
name = "quill-dos"
path = "src/main.rs"

[dependencies]
rt = { path = "../rt" }
quill-grid = { path = "../../crates/quill-grid" }
quill-app = { path = "../../crates/quill-app" }
quill-formats = { path = "../../crates/quill-formats" }
quill-heap = { path = "../../crates/quill-heap" }

[package.metadata.quill]
layer = "shell"
no_std = true
alloc = true
float = true
