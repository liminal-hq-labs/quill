[package]
name = "quill-dos"
version = "0.0.0"
edition = "2021"
publish = false
description = "Quill for DOS"
license = "Apache-2.0 OR MIT"

[[bin]]
name = "quill-dos"
path = "src/main.rs"

[dependencies]
rt = { path = "../rt" }
quill-grid = { path = "../../crates/quill-grid" }
quill-app = { path = "../../crates/quill-app", features = ["text-file-dialog", "text-recovery"] }
quill-dlg = { path = "../../crates/quill-dlg" }
quill-formats = { path = "../../crates/quill-formats" }
quill-heap = { path = "../../crates/quill-heap" }
quill-core = { path = "../../crates/quill-core" }
quill-picture = { path = "../../crates/quill-picture" }
quill-strike = { path = "../../crates/quill-strike" }
quill-paint = { path = "../../crates/quill-paint" }
quill-mouse = { path = "../../crates/quill-mouse" }
desk-hal = { path = "../hal/hal" }
desk-vga = { path = "../hal/drivers/vga" }
desk-i8042 = { path = "../hal/drivers/i8042" }
desk-pic = { path = "../hal/drivers/pic" }

[package.metadata.quill]
layer = "shell"
no_std = true
alloc = true
float = true
