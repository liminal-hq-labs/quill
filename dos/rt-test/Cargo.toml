[package]
name = "rt-test"
version = "0.0.0"
edition = "2021"
publish = false
description = "A test program for the DOS runtime's directory calls"
license = "Apache-2.0 OR MIT"

[[bin]]
name = "rt-test"
path = "src/main.rs"

[dependencies]
rt = { path = "../rt" }

[package.metadata.quill]
layer = "shell"
no_std = true
alloc = true
float = true
