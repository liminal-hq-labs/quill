# The GTK4 client's own workspace, outside the root Cargo workspace so root CI never needs GTK headers.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[workspace]
members = ["."]
resolver = "2"

[package]
name = "quill-gtk-spike"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false
description = "Spike G0: can a custom GTK4 widget show device-pixel-exact images at a fractional scale"

[[bin]]
name = "quill-gtk-spike"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
skrifa = "0.50"
tiny-skia = "0.12"
