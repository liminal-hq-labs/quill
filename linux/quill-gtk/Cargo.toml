# The GTK4 client's own workspace, outside the root Cargo workspace so root CI never needs GTK headers.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[workspace]
members = ["."]
resolver = "2"

[package]
name = "quill-gtk"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false
description = "Quill's GTK4 client: a read-only page viewer over the shared editor core, drawn by Quill's own renderer"

[lib]
name = "quill_gtk"
path = "src/lib.rs"

[[bin]]
name = "quill"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
quill-app = { path = "../../crates/quill-app", features = ["long-names", "dot-files"] }
quill-chrome = { path = "../../crates/quill-chrome" }
quill-core = { path = "../../crates/quill-core" }
quill-dialogs = { path = "../../crates/quill-dialogs" }
quill-formats = { path = "../../crates/quill-formats" }
quill-fonts = { path = "../../crates/quill-fonts" }
quill-host = { path = "../../crates/quill-host" }
quill-paint = { path = "../../crates/quill-paint", features = ["pixel"] }
quill-tty = { path = "../quill-tty" }

[dev-dependencies]
tempfile = "3"
