# DOSBox settings for the browser demo's disk bundle: two hard disks the page shares with the guest (C: the guest writes, D: the page
# writes; sizes and geometry as scripts/make-bridge-disks.py makes them), then boot the FreeDOS floppy, whose start-up batch file starts Quill.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[sdl]
autolock=true

[dosbox]
machine=svga_s3
memsize=32

[cpu]
core=auto
cycles=max

[autoexec]
@cls
imgmount 2 c.img -size 512,63,16,16 -t hdd -fs none
imgmount 3 d.img -size 512,63,16,64 -t hdd -fs none
boot fl.img
