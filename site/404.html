<!doctype html>
<!--
	Quill's page-not-found page for GitHub Pages. GitHub serves it for any missing path, so links here are absolute to the project.

	(c) Copyright 2026 Liminal HQ, Scott Morris
	SPDX-License-Identifier: Apache-2.0 OR MIT
-->
<html lang="en-CA">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Page not found · Quill</title>
		<meta name="description" content="This page isn't part of Quill's site.">
		<meta name="robots" content="noindex">
		<meta name="color-scheme" content="light dark">
		<link rel="icon" href="/quill/favicon.ico" sizes="16x16 32x32 48x48">
		<link rel="icon" href="/quill/img/quill-small.svg" type="image/svg+xml">
		<link rel="stylesheet" href="/quill/css/site.css">
		<script>
			try {
				var t = localStorage.getItem("quill-theme");
				if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
			} catch (e) {}
		</script>
	</head>
	<body>
		<main class="not-found">
			<div>
				<img src="/quill/img/quill.svg" alt="The Quill icon" width="96" height="96">
				<h1>File not found</h1>
				<p>There's no page at this address. It may have moved, or the link has a typo.</p>
				<p><a class="button" href="/quill/">Back to Quill</a></p>
			</div>
		</main>
	</body>
</html>
