<!--
	The Quill emblem as an overlay for the Afterglow wallpaper (guest/quillify.py): the gilt ring is drawn round the low sun and the nib is the
	tail of the Q. The canvas is the wallpaper's 3840 x 2160 and the ring is centred on the sun at (2880, 1846); the rest is transparent.
	The art is the Quill emblem from quill-wallpaper.svg (the icon's 1024 grid), at a scale that puts the ring's inner edge just outside the
	sun's gold disc (radius 104).

	(c) Copyright 2026 Liminal HQ, Scott Morris
	SPDX-License-Identifier: Apache-2.0 OR MIT
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" role="img">
	<title>Quill emblem overlay</title>
	<defs>
		<linearGradient id="qe-brand" x1="200" y1="860" x2="840" y2="170" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#b8893a"/>
			<stop offset=".55" stop-color="#f0a830"/>
			<stop offset="1" stop-color="#e9dcb0"/>
		</linearGradient>
		<linearGradient id="qe-nib" x1="0" y1="1" x2="1" y2="0">
			<stop offset="0" stop-color="#e9dcb0"/>
			<stop offset=".5" stop-color="#fff4d6"/>
			<stop offset="1" stop-color="#ffffff"/>
		</linearGradient>
		<mask id="qe-slit" maskUnits="userSpaceOnUse" x="-200" y="-520" width="400" height="540">
			<path d="M0 0C-40 -110 -170 -250 -170 -360L-170 -460Q-170 -500 -130 -500L130 -500Q170 -500 170 -460L170 -360C170 -250 40 -110 0 0Z" fill="#ffffff"/>
			<path d="M0 -10V-270" stroke="#000000" stroke-width="22" stroke-linecap="round"/>
			<circle cx="0" cy="-310" r="44" fill="#000000"/>
		</mask>
		<path id="qe-nib-shape" d="M0 0C-40 -110 -170 -250 -170 -360L-170 -460Q-170 -500 -130 -500L130 -500Q170 -500 170 -460L170 -360C170 -250 40 -110 0 0Z"/>
	</defs>
	<g transform="translate(2880 1846) scale(0.56) translate(-470 -466)">
		<circle cx="470" cy="466" r="268" fill="none" stroke="#050507" stroke-opacity=".45" stroke-width="80" transform="translate(0 10)"/>
		<circle cx="470" cy="466" r="268" fill="none" stroke="url(#qe-brand)" stroke-width="64"/>
		<path d="M470 222A244 244 0 0 1 714 466" fill="none" stroke="#fff4d6" stroke-opacity=".35" stroke-width="6" stroke-linecap="round"/>
		<g transform="translate(850 846) rotate(-45) scale(0.78)">
			<use href="#qe-nib-shape" fill="none" stroke="#0c0b11" stroke-width="64" stroke-linejoin="round"/>
			<use href="#qe-nib-shape" fill="url(#qe-nib)" mask="url(#qe-slit)"/>
			<path d="M-150 -470L-150 -380C-150 -290 -60 -170 -18 -60" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="10" stroke-linecap="round"/>
		</g>
	</g>
</svg>
