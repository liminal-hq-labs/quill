# The Quill Afterglow Remaster Remix (QAGRR): the Afterglow ReactOS remaster with Quill, its demo documents and two desktop shortcuts.
#
# Builds the disk the Try ReactOS page serves. It extends the compact recipe in reactos-liminal (pinned in reactos-liminal.pin) and adds
# only what is Quill's: the names, the trim beyond the compact profile, the programs and the shortcuts. All art (wallpaper, orb, icons,
# logon, boot logo) comes from the base and is not repeated here. Build it with `build-with-rl.sh`.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[recipe]
name = "qagrr"
description = "Quill Afterglow Remaster Remix: the Afterglow ReactOS remaster with Quill and its demo documents"
extends = "rl:recipes/afterglow-compact.toml"

[install]
computer_name = "QUILLDEMO"
owner_name = "Quill demo"

# The desktop and the Start menu share one icon size (Shell Icon Size), 32 px as in the Afterglow full image; the Quill shortcut icons both
# carry a 32 px frame. The stock desktop icons are hidden and the three stock shortcuts removed so only
# the Quill shortcuts remain; the mouse has no acceleration, so the page can predict the guest pointer exactly.
# `reg_files` lists the base recipe's named files again (a list replaces), including its Canadian formats with 24-hour time and its pointer
# defaults, plus Quill's `mouse-linear` and `hide-desktop-icons` and `quill-run.reg`, beside this recipe, which is applied after them. The
# wallpaper is named for people (`Afterglow Wallpaper`, which is what Display Properties lists); the BMP written there is Quill's own (see [[files]] below).
[settings]
icon_size = 32
wallpaper = "C:\\ReactOS\\Afterglow Wallpaper.bmp"
reg_files = ["display", "quiet", "watermark-off", "afterglow-logon", "regional-canada", "pointer-defaults", "mouse-linear", "hide-desktop-icons", "quill-run.reg"]
remove_desktop_shortcuts = ["Applications Manager", "Command Prompt", "Read Me"]

# The compact profile (from afterglow-compact.toml) plus the network card drivers v86 does not emulate.
[trim]
extra = ["trim-extra.txt"]

# These [[files]] merge with the base recipe's by destination, so the base's afterfetch and the neofetch family are inherited, not repeated.
# The programs, QUILLDESK.ICO and the wallpaper are staged into payload/ by build-with-rl.sh (the programs come from a Quill build, the
# icon from guest/make_desk_icon.py, the wallpaper from guest/quillify.py: the Afterglow dusk scene with the Quill emblem on its sun). The
# wallpaper takes the place of the scene rl would render, at the path settings.wallpaper names. The demo documents are the committed ones.
[[files]]
source = "payload/quill-wallpaper.bmp"
destination = "ReactOS/Afterglow Wallpaper.bmp"

[[files]]
source = "payload/QUILL32.EXE"
destination = "Quill/QUILL32.EXE"

[[files]]
source = "payload/QUILL.EXE"
destination = "Quill/QUILL.EXE"

[[files]]
source = "payload/QUILLDESK.ICO"
destination = "Quill/QUILLDESK.ICO"

[[files]]
source = "payload/QUILL31DESK.ICO"
destination = "Quill/QUILL31DESK.ICO"

[[files]]
source = "../demo/demo.qld"
destination = "Quill/DEMO.QLD"

[[files]]
source = "../demo/demo.rtf"
destination = "Quill/DEMO.RTF"

[[files]]
source = "../demo/demo16.qld"
destination = "Quill/DEMO16.QLD"

[[files]]
source = "../demo/demo16.rtf"
destination = "Quill/DEMO16.RTF"

[[files]]
source = "../demo/QUILL.HLP"
destination = "Quill/QUILL.HLP"

[[shortcuts]]
name = "Quill"
target = 'C:\Quill\QUILL32.EXE'
arguments = 'C:\Quill\DEMO.QLD'
working_dir = 'C:\Quill'
description = "Quill, 32-bit build, opening the demo letter"
icon = 'C:\Quill\QUILLDESK.ICO'

# The shortcut starts WineVDM's own launcher. A shortcut (or the Run box) that names `QUILL.EXE` directly reaches WineVDM through ReactOS's
# 16-bit hand-off, which drops the command line: Quill opens Untitled. `otvdmw.exe` (the windowed launcher, no console) hands the path and the
# document to the task intact.
[[shortcuts]]
name = "Quill (Windows 3.x, slow)"
target = 'C:\Program Files\otvdm\otvdmw.exe'
arguments = 'C:\Quill\QUILL.EXE C:\Quill\DEMO16.QLD'
working_dir = 'C:\Quill'
description = "Quill, Windows 3.x build, opening the demo letter. Slow: WineVDM inside the emulator is emulation inside emulation"
icon = 'C:\Quill\QUILL31DESK.ICO'
show = 1
