# Cargo settings for the spike: the same Pentium target, no C runtime and lld-link as QUILL32.EXE (win9x/.cargo/config.toml).
# They are repeated here because the spike sits outside win9x/: a .cargo folder under win9x/ would merge in and add Quill32's resource file.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[build]
target = "../../win9x/win9x.json"

[target.win9x]
linker = "lld-link"
rustflags = [
    "-C", "link-arg=/NODEFAULTLIB",
    "-C", "link-arg=/ENTRY:start",
    "-C", "link-arg=/SUBSYSTEM:WINDOWS,4.0",
    "-C", "link-arg=/FIXED",
    "-C", "link-arg=/DYNAMICBASE:NO",
    "-C", "llvm-args=-min-jump-table-entries=1000",
]

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true
