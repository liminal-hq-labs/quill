# Quill's Win16 workspace: the runtime library and the example programs, built for the custom `win16.json` target.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

# A workspace of its own: it needs `-Zbuild-std` and a custom target.
[workspace]

[package]
name = "quill-win16-rt"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "The Win16 runtime for Quill: a code16 target, an NE packer and import stubs (copied from rust-win16)"
publish = false
autoexamples = false
autobins = false

[package.metadata.quill]
layer = "shell"
no_std = true
alloc = true
float = true

[lib]
name = "w16"
path = "src/lib.rs"

[[bin]]
name = "probe"
path = "examples/probe/main.rs"

[[bin]]
name = "quill"
path = "examples/quill/main.rs"

[[bin]]
name = "segtest"
path = "examples/segtest/main.rs"

[[bin]]
name = "sizeprobe"
path = "examples/sizeprobe/main.rs"

[[bin]]
name = "icontest"
path = "examples/icontest/main.rs"

[features]
noalias = []
# Quill's picture-slot and stack-alias checks and the /BADSLOT test switch (examples/quill/diag.rs); off in the shipped build.
diag = []

[[bin]]
name = "stackprobe"
path = "examples/stackprobe/main.rs"

[[bin]]
name = "helptest"
path = "examples/helptest/main.rs"

[dependencies]
quill-core = { path = "../crates/quill-core" }
quill-formats = { path = "../crates/quill-formats" }
quill-grid = { path = "../crates/quill-grid" }
quill-image = { path = "../crates/quill-image" }
quill-app = { path = "../crates/quill-app" }
quill-inflate = { path = "../crates/quill-inflate" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = 0
strip = false

[profile.dev]
panic = "abort"
