# DOSBox-X profile for a 386SX-class machine with 4 MB, Windows 3.11 in 386 Enhanced mode.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[sdl]
output=surface
fullscreen=false
windowresolution=800x600

[dosbox]
machine=svga_s3
memsize=4

[cpu]
core=normal
cputype=386
cycles=fixed 3000

[dos]
ems=false
xms=true
umb=true

[autoexec]
@echo off
mount c /c
mount d /d
c:
set PATH=c:\windows;c:\utils
cd \windows
win /3
exit
