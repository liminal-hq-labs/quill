# DOSBox-X profile for the 256-colour display tests: an ET4000 (a chip Microsoft's SVGA256.DRV drives) with 32 MB and a Pentium.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[sdl]
output=surface
fullscreen=false
windowresolution=800x600

[dosbox]
machine=svga_et4000
memsize=32

[cpu]
core=normal
cputype=pentium
cycles=max

[dos]
ems=false
xms=true
umb=true

[autoexec]
@echo off
mount c /c
mount d /d
c:
set PATH=c:\windows;c:\utils
cd \windows
win /3
exit
