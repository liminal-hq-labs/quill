[sdl]
output=surface
fullscreen=false
windowresolution=800x600

[dosbox]
machine=svga_s3
memsize=32

[cpu]
core=normal
cputype=pentium
cycles=max

[dos]
ems=false
xms=true
umb=true

[autoexec]
@echo off
mount c /c
mount d /d
c:
set PATH=c:\windows;c:\utils
cd \windows
win /3
exit
