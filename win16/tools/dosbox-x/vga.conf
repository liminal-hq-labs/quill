# DOSBox-X profile for the 16-colour display tests: plain VGA, so Windows 3.11 runs its VGA.DRV at 640x480 in 16 colours.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[sdl]
output=surface
fullscreen=false
windowresolution=800x600

[dosbox]
machine=vgaonly
memsize=32

[cpu]
core=normal
cputype=pentium
cycles=max

[dos]
ems=false
xms=true
umb=true

[autoexec]
@echo off
mount c /c
mount d /d
c:
set PATH=c:\windows;c:\utils
cd \windows
win /3
exit
