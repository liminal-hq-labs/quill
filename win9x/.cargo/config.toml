# Cargo settings for the Win32 build: Pentium-class code, no C runtime, linked by lld-link (copied from win9x-rust).
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[build]
target = "win9x.json"

[target.win9x]
linker = "lld-link"
rustflags = [
    # No CRT and no std, so nothing newer than Win98 gets imported. The entry point and the fixed base are per artefact: the program's
    # `build.rs` sets `/ENTRY:start` and `/FIXED`, each module's sets its own (W9X-132).
    "-C", "link-arg=/NODEFAULTLIB",
    # Subsystem version 4.0 is what the Windows 9x loader expects.
    "-C", "link-arg=/SUBSYSTEM:WINDOWS,4.0",
    # Windows 9x predates ASLR (NT, ReactOS and Wine honour this): the load address is the same on every run.
    "-C", "link-arg=/DYNAMICBASE:NO",
    # No jump tables: they are data inside the code section, which the Pentium scan would read as instructions.
    "-C", "llvm-args=-min-jump-table-entries=1000",
]

# The prebuilt \`core\` for i686 assumes SSE2 (D33), so build \`core\` and \`alloc\` here for a Pentium. The build script sets RUSTC_BOOTSTRAP=1.
[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true
