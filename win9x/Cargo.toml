[workspace]
members = ["quill-win9x", "clipcheck"]
# `cargo build` builds Quill alone; the test helper is built by win9x/tools/wine-clipboard.sh.
default-members = ["quill-win9x"]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
overflow-checks = true
