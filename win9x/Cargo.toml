[workspace]
members = ["quill-win9x", "hostlink"]
# `cargo build` in this folder builds QUILL32.EXE only; HOSTLINK.EXE is built by build.sh with its own link line (no resource file).
default-members = ["quill-win9x"]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
overflow-checks = true
