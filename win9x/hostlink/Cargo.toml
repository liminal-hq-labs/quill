[package]
name = "quill-hostlink-exe"
version = "0.0.0"
edition = "2021"
publish = false
description = "The host link's guest helper for ReactOS and Windows: the clipboard bridge"
license = "Apache-2.0 OR MIT"

[[bin]]
name = "hostlink"
path = "src/main.rs"

# Test only (the end-to-end check's copy source); never on the product disk.
[[bin]]
name = "hlclip"
path = "src/hlclip.rs"

[dependencies]
quill-hostlink-guest = { path = "../../crates/quill-hostlink-guest" }

[package.metadata.quill]
layer = "shell"
no_std = true
alloc = false
float = false
