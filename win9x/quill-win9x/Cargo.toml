[package]
name = "quill-win9x"
version = "0.0.0"
edition = "2021"
publish = false
description = "Quill for Windows 9x"
license = "Apache-2.0 OR MIT"

[[bin]]
name = "quill32"
path = "src/main.rs"

[dependencies]
quill-app = { path = "../../crates/quill-app", features = ["long-names"] }
quill-core = { path = "../../crates/quill-core" }
quill-formats = { path = "../../crates/quill-formats" }
quill-grid = { path = "../../crates/quill-grid" }
quill-heap = { path = "../../crates/quill-heap" }
quill-image = { path = "../../crates/quill-image" }

[package.metadata.quill]
layer = "shell"
no_std = true
alloc = true
float = true
