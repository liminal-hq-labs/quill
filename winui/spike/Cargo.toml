# The WinUI 3 spike workspace: a Windows Reactor window for x86_64 Windows 11, outside the root Cargo workspace.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[workspace]
members = ["."]
resolver = "2"

[package]
name = "quill-winui-spike"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false
description = "Spikes S0a and S0b: can Windows Reactor show a pixel-exact page in a SwapChainPanel from a Linux-built self-contained zip"

[[bin]]
name = "quill-winui-spike"
path = "src/main.rs"

[[bin]]
name = "quill-winui-s0b"
path = "src/s0b/main.rs"

[dependencies]
windows-reactor = "=0.100.0"
# The same windows-core Reactor uses: its swap-chain call takes this crate's `IUnknown`.
reactor-core = { package = "windows-core", version = "=0.100.0" }
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_Graphics_Direct3D",
	"Win32_Graphics_Direct3D11",
	"Win32_Graphics_Dxgi",
	"Win32_Graphics_Dxgi_Common",
	"Win32_System_Threading",
	"Win32_System_LibraryLoader",
	"Win32_Graphics_Gdi",
	"Win32_UI_WindowsAndMessaging",
	"Win32_UI_Input_Ime",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_HiDpi",
	"Foundation",
	"UI_Text_Core",
] }
skrifa = "0.50"
tiny-skia = "0.12"
accesskit = { version = "0.25", default-features = false }
accesskit_windows = { version = "0.35.2", default-features = false }
encoding_rs = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
